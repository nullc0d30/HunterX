# HunterX — AI-Assisted Offensive Security Framework

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hunterx"
version = "6.0.0"
description = "AI-assisted offensive security framework featuring reasoning-driven reconnaissance, vulnerability assessment, attack surface analysis, threat intelligence, multi-agent orchestration, and multi-format reporting."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ahmed Awad (NullC0d3)"},
]
keywords = [
    "security", "red-team", "vulnerability", "penetration-testing",
    "bug-bounty", "offensive-security", "ai", "vulnerability-scanner",
    "osint", "reconnaissance", "web-security", "cloud-security",
    "api-security", "mitre-attack", "owasp", "python",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Topic :: Security :: Penetration Testing",
    "Typing :: Typed",
]

dependencies = [
    "requests>=2.32.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "websocket-client>=1.8.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "networkx>=3.0",
    "urllib3>=2.0",
    "dataclasses-json>=0.6.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "pydantic>=2.0"]
browser = ["playwright>=1.40"]
graphviz = ["graphviz>=0.20"]
ml = ["scikit-learn>=1.3", "numpy>=1.24"]
all = ["hunterx[api,browser,graphviz,ml]"]

[project.urls]
Homepage = "https://github.com/nullc0d30/HunterX"
Repository = "https://github.com/nullc0d30/HunterX"
Documentation = "https://nullc0d30.github.io/HunterX"
Changelog = "https://github.com/nullc0d30/HunterX/blob/main/CHANGELOG.md"
Issues = "https://github.com/nullc0d30/HunterX/issues"

[project.scripts]
hunterx = "hunterx.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
hunterx = ["py.typed", "config/*.yaml", "assets/payloads/*", "assets/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hunterx*"]
