---
layout: default
---

<article class="tutorial" itemscope itemtype="https://schema.org/LearningResource">
  <header class="tutorial-header">
    <h1 itemprop="name">{{ page.title | escape }}</h1>
    <p class="tutorial-meta">Tutorial &middot; {{ page.date | date: "%B %d, %Y" }}</p>
  </header>
  <div itemprop="description">
    {{ page.description | markdownify }}
  </div>
  <div>
    {{ content }}
  </div>
</article>

<style>
  .tutorial-header h1 { font-size: 1.8rem; margin: 0 0 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  .tutorial-meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem; }
</style>
