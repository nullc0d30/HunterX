---
layout: default
---

<article class="post" itemscope itemtype="https://schema.org/Article">
  <header class="post-header">
    <h1 itemprop="headline">{{ page.title | escape }}</h1>
    <p class="post-meta" itemprop="datePublished" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %d, %Y" }} &middot; {{ page.author | default: site.author.name }}
    </p>
  </header>
  <div itemprop="articleBody">
    {{ content }}
  </div>
</article>

<style>
  .post-header h1 { font-size: 1.8rem; margin: 0 0 0.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  .post-meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
</style>
