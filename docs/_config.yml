title: HunterX — AI-Assisted Vulnerability Discovery, Validation & Proof Engine
tagline: "Find it. Verify it. Prove it. Report it."
description: >-
  HunterX is an open-source, AI-assisted vulnerability discovery, validation
  and proof engine for authorized cybersecurity testing and research, created
  and maintained by Ahmed Awad (AKA NullC0d3). It plans, orchestrates,
  executes, validates, correlates and reports security assessments by
  integrating open-source security tools. HunterX v7 features
  autonomous mission orchestration, adaptive mission planning, a toolchain
  intelligence layer with 92 registered tools, evidence-driven vulnerability
  validation, proof and PoC engineering with replay and reproducibility,
  target memory and campaign intelligence, cloud/SaaS attack-surface
  intelligence, knowledge-graph correlation, professional reporting (Markdown,
  HTML, JSON, SARIF, PDF, package), a TIDB-backed persistence layer, and a
  Clean Architecture Python core. Apache 2.0.
url: "https://nullc0d30.github.io"
baseurl: "/HunterX"
repository: nullc0d30/HunterX
logo: /assets/images/logo.png
image: /assets/images/logo.png
author:
  name: Ahmed Awad (NullC0d3)
  alias: NullC0d3
  url: https://github.com/nullc0d30
twitter:
  username: nullc0d30
  card: summary_large_image
social:
  name: HunterX
  links:
    - https://github.com/nullc0d30/HunterX
    - https://github.com/nullc0d30
    - https://hub.docker.com/u/nullc0d30
lang: en_US
timezone: UTC

# SEO keywords
keywords: >-
  HunterX, HunterX v7, AI vulnerability scanner, AI penetration testing,
  AI-assisted vulnerability discovery, vulnerability validation, PoC
  generation, proof of concept security, bug bounty automation, bug bounty
  tools, penetration testing tools, red team framework, offensive security
  platform, open source vulnerability scanner, web application security, API
  security, cloud security, security reconnaissance, security automation,
  security testing, red team, OSINT, cybersecurity, security orchestration,
  evidence-driven validation, PoC engineering, SARIF, authorized security
  testing, vulnerability proof engine

# SEO
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Build
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  tutorials:
    output: true
    permalink: /tutorials/:title/
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
      author: Ahmed Awad (NullC0d3)
      image: /assets/images/logo.png
  - scope:
      path: "_posts"
    values:
      layout: post
      author: Ahmed Awad (NullC0d3)
  - scope:
      path: "tutorials"
    values:
      layout: tutorial
  - scope:
      path: "comparisons"
    values:
      layout: default
  - scope:
      path: "releases"
    values:
      layout: default

# Include
include:
  - _redirects

# Exclude
exclude:
  - README.md
  - LICENSE
  - NOTICE
  - vendor
  - Gemfile
  - Gemfile.lock
  - "*.ps1"
  - "*.bat"
  - archive

# Feed
feed:
  path: /blog/feed.xml

# SEO tag
webmaster_verifications:
  google: ""
  bing: ""
  yandex: ""
