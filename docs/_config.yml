title: HunterX — AI-Assisted Vulnerability Hunter
tagline: Production-grade Red Team orchestration framework with 4-stage reasoning pipeline
description: >-
  HunterX is an open-source, AI-assisted vulnerability scanner and Red Team
  orchestration framework. It uses a reasoning engine to observe, hypothesize,
  probe, and verify vulnerabilities through a gated 4-stage pipeline with
  operational safety, stealth, and explainability. Supports REST API, WebSocket,
  GraphQL, OOB detection, time-based injection, WAF evasion, and plugin system.
  Licensed under Apache 2.0.
url: "https://nullc0d30.github.io/HunterX"
repository: nullc0d30/HunterX
author:
  name: Ahmed Awad (NullC0d3)
  url: https://github.com/nullc0d30
lang: en_US
timezone: UTC

# SEO
google_analytics:
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-readme-index

# Theme
theme: jekyll-theme-cayman

# Build
markdown: GFM
highlighter: rouge

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
      author: Ahmed Awad (NullC0d3)
  - scope:
      path: "**/*.md"
    values:
      image: /assets/images/hunterx-social.png

# Exclude
exclude:
  - README.md
  - LICENSE
  - NOTICE
  - vendor
