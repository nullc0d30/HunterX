title: HunterX — AI-Powered Security Orchestration & Intelligence Platform
tagline: Plans, orchestrates, executes, validates, correlates and reports authorized security assessments by integrating open-source security tools.
description: >-
  HunterX is an open-source, authorized cybersecurity testing and research
  platform. It plans, orchestrates, executes, validates, correlates and reports
  security assessments by integrating open-source security tools. HunterX v7
  features autonomous mission orchestration, adaptive mission planning, a
  toolchain intelligence layer with 100+ registered tools, evidence-driven
  vulnerability validation, proof and PoC engineering, target memory and
  campaign intelligence, professional reporting (6 export formats, SARIF), a
  TIDB-backed persistence layer, and a Clean Architecture Python core. Apache
  2.0.
url: "https://nullc0d30.github.io"
baseurl: "/HunterX"
repository: nullc0d30
logo: /assets/images/logo.png
image: /assets/images/logo.png
author:
  name: Ahmed Awad (NullC0d3)
  alias: NullC0d3
  url: https://github.com/nullc0d30
twitter:
  username: nullc0d30
  card: summary_large_image
social:
  name: HunterX
  links:
    - https://github.com/nullc0d30
    - https://hub.docker.com/u/nullc0d30
lang: en_US
timezone: UTC

# SEO keywords
keywords: >-
  HunterX, Security Orchestration, Offensive Security, OSINT,
  Attack Surface Management, Threat Intelligence, Cybersecurity, Penetration
  Testing, Automation, Reconnaissance, Bug Bounty, Open Source Security,
  security assessment platform, API security, web application security, cloud
  security, security automation, mission orchestration, toolchain intelligence,
  evidence-driven validation, PoC engineering, SARIF, MITRE ATT&CK, OWASP,
  authorized security testing, red team platform

# SEO
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Build
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  tutorials:
    output: true
    permalink: /tutorials/:title/
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
      author: Ahmed Awad (NullC0d3)
      image: /assets/images/logo.png
- scope:
       path: "_posts"
     values:
       layout: post
       author: Ahmed Awad (NullC0d3)
- scope:
       path: "tutorials"
     values:
       layout: tutorial
  - scope:
      path: "comparisons"
    values:
      layout: default
  - scope:
      path: "releases"
    values:
      layout: default

# Include
include:
  - _redirects

# Exclude
exclude:
  - README.md
  - LICENSE
  - NOTICE
  - vendor
  - Gemfile
  - Gemfile.lock
  - "*.ps1"
  - "*.bat"
  - archive

# Feed
feed:
  path: /blog/feed.xml

# SEO tag
webmaster_verifications:
  google: ""
  bing: ""
  yandex: ""
