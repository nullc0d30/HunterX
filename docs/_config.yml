title: HunterX — AI-Assisted Vulnerability Hunter
tagline: Open-source AI-assisted vulnerability scanner with Security Skills Framework, Reasoning Engine, and Multi-Agent Platform
description: >-
  HunterX is an open-source AI-assisted vulnerability scanner and security
  assessment platform. Features include a Security Skills Framework (41 skills),
  Reasoning Engine, Multi-Agent Platform (10 agents), AI Provider Abstraction
  Layer, Knowledge Graph, Threat Modeling, Attack Chain Analysis, Payload
  Intelligence Platform with mutation engine, MITRE ATT&CK mapping, and
  enterprise REST API. Licensed under Apache 2.0.
url: "https://nullc0d30.github.io/HunterX"
baseurl: "/HunterX"
repository: nullc0d30/HunterX
author:
  name: Ahmed Awad (NullC0d3)
  url: https://github.com/nullc0d30
lang: en_US
timezone: UTC

# SEO
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

# Build
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  tutorials:
    output: true
    permalink: /tutorials/:title/
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
      author: Ahmed Awad (NullC0d3)
      image: /assets/images/hunterx-social.png
  - scope:
      path: "_posts"
    values:
      layout: default
      author: Ahmed Awad (NullC0d3)
  - scope:
      path: "tutorials"
    values:
      layout: default
  - scope:
      path: "comparisons"
    values:
      layout: default
  - scope:
      path: "releases"
    values:
      layout: default

# Include
include:
  - _redirects

# Exclude
exclude:
  - README.md
  - LICENSE
  - NOTICE
  - vendor
  - Gemfile
  - Gemfile.lock
  - "*.ps1"
  - "*.bat"

# Feed
feed:
  path: /blog/feed.xml
