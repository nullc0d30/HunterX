#
# Default configuration profile shipped with the package.
# Values here are safe for development. Production deployments override them
# via HUNTERX_* environment variables or a user profile file.

app_name: HunterX
environment: production
log_level: INFO

database:
  # Default sentinel — resolved at runtime to <application root>/data/hunterx.db
  # (see hunterx.config.paths). Set HUNTERX_DATABASE_URL to override.
  url: "sqlite:///hunterx.db"
  echo: false
  pool_size: 10
  pool_timeout: 30

cache:
  backend: memory
  ttl_seconds: 300

queue:
  backend: memory
  prefetch: 8

security:
  sandbox_enabled: true
  sandbox_timeout_seconds: 30.0

api:
  host: "127.0.0.1"
  port: 8080

# AI configuration is external and optional. Set HUNTERX_AI_* variables (or a
# local .env file, see .env.example); no API keys are ever stored here.
ai:
  provider: ""
  model: ""

telemetry_enabled: true
