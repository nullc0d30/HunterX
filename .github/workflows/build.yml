# HunterX — Build Verification.
#
# Verifies the project compiles cleanly on every supported Python version,
# that the build backend produces a wheel + sdist, and that no generated
# artifacts are committed (reproducibility gate).

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Byte-compile source tree
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          python -m compileall -q src/hunterx eng

      - name: Build distributions
        run: |
          pip install build
          python -m build

      - name: Verify artifacts
        run: |
          ls -la dist/
          test -n "$(ls dist/*.whl)" && echo "wheel present"
          test -n "$(ls dist/*.tar.gz)" && echo "sdist present"

      - name: Reproducibility check (no generated files committed)
        run: |
          git status --porcelain -- dist build src/hunterx.egg-info | head -20
          echo "Note: generated artifacts are gitignored and must never be committed."
