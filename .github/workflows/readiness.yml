#
# HunterX — Production Readiness Assessment.
#
# Generates the final readiness report (architecture health, security health,
# code quality, coverage, documentation score, dependency health, release
# readiness, production-readiness score, technical debt) and publishes it as a
# workflow artifact. The assessment itself does not block merges; the
# per-gate workflows do.
#
# Note: this workflow no longer deploys to the GitHub Pages environment. The
# documentation site is deployed exclusively by the "Deploy Documentation"
# workflow (.github/workflows/pages.yml).

name: Readiness Assessment

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness
  cancel-in-progress: true

jobs:
  readiness:
    name: Production Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,report]"
          pip install mypy vulture bandit pip-audit safety semgrep cyclonedx-py pip-licenses

      - name: Run readiness assessment
        run: python -m eng readiness --json || true

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: artifacts/readiness.json
          if-no-files-found: error
