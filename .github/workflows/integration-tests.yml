#
# HunterX — Integration Tests.
#
# Runs the integration and golden suites that exercise repositories, event bus,
# observability and TiDB/alembic paths against in-memory and SQLite backends.

name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,report]"

      - name: Run integration tests
        run: pytest -q tests/integration tests/golden tests/acceptance -m "not tools" -v

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: |
            artifacts/
            pytest*.log
          if-no-files-found: ignore
