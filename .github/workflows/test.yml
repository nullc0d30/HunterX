#
# HunterX — Test (legacy entry-point, superseded by the CI Quality Gates).
#
# Kept for the README badge and as a fast smoke check: installs the project and
# runs the mandatory quality gates through the `eng` platform. The full CI
# matrix lives in .github/workflows/{ci,unit-tests,integration-tests,
# architecture-tests,performance-tests,security-tests,docs-validation,
# packaging-validation}.yml.

name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest ruff mypy vulture bandit pip-audit safety

      - name: Run mandatory quality gates
        run: python -m eng gates --gate ruff --gate mypy --gate architecture --gate docs --gate compliance --gate hygiene

      - name: Architecture enforcement
        run: hunterx-arch lint --root . || python -m hunterx.architecture lint --root .

      - name: Test with pytest
        run: python -m pytest tests/unit tests/component tests/architecture -v -m "not tools"
