# HunterX — Unit Tests.
#
# Runs the unit/component/architecture test suites across supported Python
# versions. A failure blocks the pull request.

name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,report]"

      - name: Run unit tests with coverage
        run: |
          pytest -q --cov hunterx --cov-report=xml:artifacts/coverage-unit.xml \
            --cov-report=term tests/unit tests/component -m "not tools"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-py${{ matrix.python-version }}
          path: artifacts/coverage-unit.xml
          if-no-files-found: ignore
