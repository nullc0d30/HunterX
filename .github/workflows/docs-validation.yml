# HunterX — Documentation Validation.
#
# Runs the docs quality gate (required files, sections, internal links,
# markdown well-formedness) plus markdownlint over the documentation tree.

name: Documentation Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run documentation quality gate
        run: python -m eng gates --gate docs

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        continue-on-error: true
        with:
          globs: |
            README.md
            docs/**/*.md

      - name: Upload docs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-report
          path: artifacts/docs-report.json
          if-no-files-found: ignore
