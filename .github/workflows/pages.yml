#
# HunterX — Documentation Deployment to GitHub Pages.
#
# Builds the Jekyll documentation site in docs/ and deploys it to
# https://nullc0d30.github.io/HunterX/ using the official GitHub Pages
# Actions (configure-pages / upload-pages-artifact / deploy-pages).
#
# This is the single Pages deployment mechanism for the documentation.
# The Readiness Assessment workflow publishes its report as a regular
# Actions artifact and no longer deploys to the Pages environment.

name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Jekyll Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
